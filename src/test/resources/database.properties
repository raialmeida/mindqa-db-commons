# Exemplo de configuração com o novo formato de prefixo por tipo de banco
# Coloque este arquivo em src/test/resources ou use: mvn test -Ddb.config=seu-arquivo.properties

# Cada prefixo é uma conexão independente: postgresql, sqlserver, mysql e oracle.
# Somente a conexão utilizada pelo teste será aberta.
DB_DEFAULT_CONNECTION=postgresql

# PostgreSQL
POSTGRESQL_HOST=localhost
POSTGRESQL_PORT=5432
POSTGRESQL_USER=qa_user
POSTGRESQL_PASS=senha123
POSTGRESQL_NAME=qa_database

# SQL Server
SQLSERVER_HOST=localhost
SQLSERVER_PORT=1433
SQLSERVER_USER=admin
SQLSERVER_PASS=admin_password
SQLSERVER_NAME=qa_database

# MySQL
MYSQL_HOST=localhost
MYSQL_PORT=3306
MYSQL_USER=qa_user
MYSQL_PASS=senha123
MYSQL_NAME=qa_database

# Oracle
ORACLE_HOST=localhost
ORACLE_PORT=1521
ORACLE_USER=scott
ORACLE_PASS=tiger
ORACLE_NAME=FREEPDB1
